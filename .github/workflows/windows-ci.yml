name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore
        run: nuget restore Contoso.LegacyBank.Documents.sln
      - name: Build
        shell: cmd
        run: msbuild Contoso.LegacyBank.Documents.sln /m /p:Configuration=Release /p:RestorePackages=false
      - name: Test
        shell: powershell
        run: |
          $vstest = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\Extensions\TestPlatform\vstest.console.exe"
          & $vstest tests\Contoso.LegacyBank.Documents.Tests\bin\Release\Contoso.LegacyBank.Documents.Tests.dll /TestAdapterPath:packages\NUnit3TestAdapter.4.5.0\build\net462
